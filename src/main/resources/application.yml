server:
  port: 8084
spring:
  application:
    name: payment-cash-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payment_cash_service_db?currentSchema=payment_cash_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: payment_cash_service
  sql:
    init:
      mode: always
services:
  audit:
    # reporting-audit-service: registro de auditoria de las acciones de los usuarios.
    base-url: ${AUDIT_SERVICE_URL:http://localhost:8085/api}
  tenant-management:
    base-url: ${TENANT_SERVICE_URL:http://localhost:8081/api}
